
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS V1.0 — UI Test</title>
    <link rel="stylesheet" href="jarvis.css">
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            padding: 32px;
            box-sizing: border-box;
            background: #06111c;
            color: #e6f7ff;
            font-family: Arial, sans-serif;
        }

        .test-banner {
            max-width: 680px;
            padding: 24px;
            border: 1px solid rgba(37, 215, 255, 0.25);
            border-radius: 14px;
            background: #0a1b29;
        }

        .test-banner h1 {
            color: #25d7ff;
        }

        .test-banner p {
            line-height: 1.7;
        }
    </style>
</head>
<body>
    <main class="test-banner">
        <h1>RHINOCEROS — JARVIS UI TEST</h1>
        <p>Halaman pengujian terpisah. Dashboard HOME tidak dimodifikasi.</p>
        <p>Gunakan tombol mengambang di pojok kanan bawah untuk membuka panel JARVIS.</p>
    </main>

    <div id="jarvis-test-mount"></div>

    <script>
        fetch("jarvis.html")
            .then(function (response) {
                if (!response.ok) {
                    throw new Error("Gagal memuat jarvis.html");
                }
                return response.text();
            })
            .then(function (html) {
                document.getElementById("jarvis-test-mount").innerHTML = html;

                const script = document.createElement("script");
                script.src = "jarvis-core.js";
                document.body.appendChild(script);
            })
            .catch(function (error) {
                console.error("JARVIS UI Test:", error);
                document.getElementById("jarvis-test-mount").textContent =
                    "Panel JARVIS gagal dimuat. Periksa Console browser.";
            });
    </script>
</body>
</html>
